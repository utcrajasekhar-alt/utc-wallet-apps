[build]
  # The Vite app lives in the utc-wallet/ subfolder
  base = "utc-wallet"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for client-side routes (e.g. /login)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
